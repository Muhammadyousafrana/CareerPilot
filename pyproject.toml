[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerpilot"
version = "0.1.0"
description = "An AI-powered, automated job search and application system built with Claude and specialized agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.49.0",
    "claude-agent-sdk>=0.1.42",
    "python-dotenv>=1.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "autonomous_job_system/prompts"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
agent = "autonomous_job_system.agent:run"
